{{if .Events}}<details class="ui-surface" open>
    <summary class="flex min-h-11 cursor-pointer items-center justify-between gap-3 px-4 py-3">
        <h2 class="ui-card-heading">Погодные события (24 часа)</h2>
        <span class="inline-flex h-5 w-5 text-gray-500 dark:text-gray-400" aria-hidden="true">{{icon "circle-alert"}}</span>
    </summary>

    <div class="space-y-3 border-t border-gray-200 px-4 pb-4 pt-3 dark:border-gray-700">
        {{range .Events}}
        <div class="flex items-start space-x-3 text-sm border-l-2 border-gray-200 dark:border-gray-700 pl-3 hover:border-blue-500 dark:hover:border-blue-400 transition-colors">
            <span class="mt-0.5 inline-flex h-5 w-5 flex-shrink-0 text-gray-500 dark:text-gray-400" aria-hidden="true">{{eventIcon .Type}}</span>
            <div class="flex-1 min-w-0">
                <p class="text-gray-900 dark:text-white font-medium">{{.Description}}</p>
                {{if .Details}}
                <p class="text-xs text-gray-600 dark:text-gray-400 mt-0.5">{{.Details}}</p>
                {{end}}
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">{{.Time.Format "15:04"}}, {{russianDate .Time "short"}}</p>
            </div>
        </div>
        {{end}}
    </div>
</details>{{end -}}
